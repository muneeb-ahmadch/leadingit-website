name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint (typecheck + eslint)
        run: npm run lint

      - name: Build (prerender all routes)
        run: npm run build

      # HISTORICAL NOTE, corrected 2026-08-06: this step used to warn that a green
      # run was NOT a deployable artefact because product/brand imagery lived
      # outside version control. That stopped being true when Phase 3 committed the
      # optimised derivatives — public/products, public/brands and public/lithome
      # are all tracked now, so a green CI build IS deployable. `deploy.yml` builds
      # from a clean clone on this basis; leaving the old warning here would have
      # read as a reason not to trust it.
      #
      # This is the Phase 2 SEO/structured-data gate: title/description/canonical/
      # hreflang/h1 shape on every emitted page (the old standalone "every page has
      # a real, non-empty h1" step is a strict subset of this — one-and-only-one
      # non-empty <h1> is check #1 below — so it is retired, not weakened), plus
      # the full JSON-LD gate (single @graph, no dangling/duplicate @id, no
      # offers/price/InStock, no Product on the nine range routes, no Pakistan
      # place/address, breadcrumb/JSON-LD parity, and every emitted @type/property
      # checked against the committed schema.org vocabulary subset). Zero errors
      # AND zero warnings, per docs/11-SEO-VALIDATION.md; see that file for exactly
      # what this does and does not prove versus a live Rich Results Test run.
      - name: "Gate: SEO + structured data (scripts/validate-seo.mjs)"
        run: npm run validate:seo

      - name: "Gate: no stale blacknova slug in output"
        run: |
          if grep -rli 'blacknova' dist; then
            echo "Stale 'blacknova' references found in dist" && exit 1
          fi
          echo "OK: no stale slug references"

      # TODO(Phase 1 deploy leg / Phase 2): Lighthouse CI budget gate against a served
      # build — mobile Performance >= 95, SEO = 100, Accessibility >= 95, plus CWV
      # budget (LCP <= 2.0s, INP <= 200ms, CLS <= 0.05). Not wired yet: no deploy URL
      # exists and serving+auditing in CI needs the deploy story settled first.

      # NOTE: no deploy job by design. Deployment to HostGator (SFTP/FTPS + Cloudflare
      # purge) lands once the cPanel docroot question is answered and secrets exist in
      # the repo settings — never hardcoded here.
